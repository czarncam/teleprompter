<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MY TelePROMPTER</title>
  <!-- Cambia estilo.css?v=10 por v=99 -->
  <link rel="stylesheet" href="style.css?v=99">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <header id="main-header">
    <div class="brand-logo" id="navHome">
      MY <span class="brand-pro">PRO</span>MPTER
    </div>
    <nav>
      <button id="navEditor" class="nav-btn">
        <span class="nav-icon">📝</span>
        <span>Editor</span>
      </button>
      <button id="navPrompter" class="nav-btn">
        <span class="nav-icon">📹</span>
        <span>Prompter</span>
      </button>
      <button id="navGallery" class="nav-btn">
        <span class="nav-icon">📁</span>
        <span>Galería (<span id="videoCount">0</span>)</span>
      </button>
    </nav>
  </header>

  <!-- SECCIÓN 0: HOME / INICIO -->
  <main id="section-home" class="app-section">
    <div class="home-container">
      <div class="hero-content">
        <h1 class="main-title">MY <span class="title-pro">PRO</span>MPTER</h1>
        <p class="subtitle">Estudio de grabación y lectura profesional para creadores de contenido.</p>
      </div>

      <div class="home-grid">
        <button id="btnHomeEditor" class="home-card">
          <div class="card-icon">📝</div>
          <h2>Escribir Script</h2>
          <p>Redacta, pega o edita tu guion antes de grabar.</p>
        </button>

        <button id="btnHomePrompter" class="home-card card-primary">
          <div class="card-icon">📹</div>
          <h2>Ir al Teleprompter</h2>
          <p>Inicia la cámara, ajusta el ritmo y empieza a grabar.</p>
        </button>

        <button id="btnHomeGallery" class="home-card">
          <div class="card-icon">📁</div>
          <h2>Ver Galería</h2>
          <p>Revisa, descarga o gestiona tus videos grabados.</p>
        </button>
      </div>

      <footer class="home-footer">
        POWERED BY CZAR
      </footer>
    </div>
  </main>

  <!-- SECCIÓN 1: EDITOR DE TEXTO -->
  <main id="section-editor" class="app-section" style="display: none;">
    <div class="editor-container">
      <textarea id="textInput" placeholder="Escribe o pega el guion aquí..."></textarea>
      <div class="editor-actions">
        <button id="btnGoToPrompter" class="btn-ios-primary">Ir al Teleprompter ▶</button>
      </div>
    </div>
  </main>

  <!-- SECCIÓN 2: TELEPROMPTER -->
  <main id="section-prompter" class="app-section" style="display: none;">
    <video id="cameraPreview" autoplay playsinline webkit-playsinline muted></video>

    <div id="prompter-display">
      <div id="prompter-text"></div>
    </div>

    <!-- PANEL FLOTANTE INFERIOR DE CONTROLES -->
    <div id="controls" class="ios-bottom-bar">
      <div class="controls-row settings-row">
        <div class="slider-group">
          <label for="speed">Velocidad</label>
          <input type="range" id="speed" min="0.2" max="5" step="0.1" value="1">
        </div>
        <div class="slider-group">
          <label for="fontSize">Tamaño</label>
          <input type="range" id="fontSize" min="20" max="80" value="36">
        </div>
        <button id="btnMirror" class="btn-icon" title="Modo Espejo">↔</button>
      </div>

      <div class="controls-row actions-row">
        <button id="btnReset" class="btn-ios-secondary">↺ Inicio</button>
        <button id="btnPlay" class="btn-ios-secondary">▶ Leer</button>
        
        <button id="btnRecord" class="btn-ios-rec">
          <span class="rec-dot"></span> Grabar
        </button>
        <button id="btnStopRec" class="btn-ios-rec recording" style="display: none;">
          <span class="square-dot"></span> Detener
        </button>

        <button id="btnZoom" class="btn-ios-secondary">🔍 0.5x</button>
        <button id="btnSwitchCam" class="btn-ios-secondary">🔄 Cámara</button>
      </div>
    </div>
  </main>

  <!-- SECCIÓN 3: GALERÍA DE GRABACIONES -->
  <main id="section-gallery" class="app-section" style="display: none;">
    <div class="gallery-container">
      <h2 class="gallery-title">Grabaciones</h2>
      <div id="galleryGrid" class="gallery-grid">
        <p id="emptyGalleryMsg">No hay videos grabados aún.</p>
      </div>
    </div>
  </main>

  <!-- MODAL DE REPRODUCCIÓN DE VIDEO -->
  <div id="videoModal" class="video-modal" style="display: none;">
    <div class="video-modal-content">
      <button id="btnCloseModal" class="btn-close-modal">✕</button>
      <video id="modalVideoPlayer" controls playsinline webkit-playsinline></video>
    </div>
  </div>

  <script src="script.js?v=99"></script>
</body>
</html>
