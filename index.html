<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Teleprompter Personal</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="controls">
    <button id="btnPlay">▶ Iniciar / Pausa</button>
    <button id="btnRecord" disabled>🔴 Grabar</button>
    <label>Velocidad: <input type="range" id="speed" min="1" max="10" value="3"></label>
    <label>Tamaño: <input type="range" id="fontSize" min="20" max="80" value="36"></label>
    <button id="btnMirror">↔ Espejo</button>
    <button id="btnReset">↺ Editar / Reiniciar</button>
  </div>

  <div id="editor-container">
    <textarea id="textInput" placeholder="Pega tu texto aquí sin límite de caracteres..."></textarea>
  </div>

  <div id="prompter-display">
    <video id="cameraPreview" autoplay playsinline muted></video>
    <div id="prompter-text"></div>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
